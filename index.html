
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kickoff Football</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #263640, #10171d 70%);
      color: #edf3f0;
      font-family: Arial, sans-serif;
    }

    .app { width: min(100%, 1120px); }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 32px);
      letter-spacing: -1px;
    }

    .accent { color: #80d69a; }

    .subtitle {
      margin-top: 6px;
      color: #9eafb5;
      font-size: 13px;
    }

    .status {
      color: #a7efbd;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .stadium {
      padding: 10px;
      border: 1px solid #40515a;
      border-radius: 12px;
      background: #202d34;
      box-shadow: 0 24px 70px #0006;
    }

    .viewport {
      overflow: hidden;
      border-radius: 5px;
      background: #216c3c;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      outline: none;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 16px 4px 4px;
    }

    .group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .label {
      color: #9eafb5;
      font-size: 12px;
      margin-right: 3px;
    }

    button {
      padding: 9px 12px;
      border: 1px solid #455760;
      border-radius: 6px;
      background: #293840;
      color: #e5eeeb;
      cursor: pointer;
      font-size: 12px;
      transition: background 120ms, border-color 120ms;
    }

    button:hover { border-color: #91c7a0; }

    button[aria-pressed="true"] {
      background: #285f40;
      border-color: #71bd8a;
      color: white;
    }

    button:focus-visible {
      outline: 2px solid #a7efbd;
      outline-offset: 3px;
    }

    .note {
      margin: 12px 2px 0;
      color: #84969e;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body { padding: 18px 10px; }
      .stadium { padding: 6px; }
      .controls { align-items: flex-start; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <h1>KICKOFF <span class="accent">FOOTBALL</span></h1>
        <div class="subtitle">THE PITCH · PLAYER PREVIEW</div>
      </div>
      <div class="status">● DEVELOPMENT</div>
    </header>

    <section class="stadium">
      <div class="viewport">
        <canvas
          id="pitch"
          width="1200"
          height="760"
          aria-label="Football pitch with a movable blue player and a ball"
          tabindex="0"
        ></canvas>
      </div>

      <div class="controls">
        <div class="group">
          <span class="label">CAMERA</span>
          <button id="full" aria-pressed="true">Full pitch</button>
          <button id="zoom" aria-pressed="false">Zoomed in</button>
        </div>

        <div class="group">
          <span class="label">GRASS</span>
          <button id="stripes" aria-pressed="true">Stripes</button>
          <button id="rings" aria-pressed="false">Concentric</button>
        </div>
      </div>
    </section>

    <p class="note">
      Controls: WASD or arrow keys to move. The ball is stationary for now.
    </p>
  </main>

  <script>
    const canvas = document.getElementById("pitch");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;

    const field = { x: 80, y: 40, w: 1040, h: 680 };
    const centerX = field.x + field.w / 2;
    const centerY = field.y + field.h / 2;

    const state = {
      camera: "full",
      grass: "stripes"
    };

    const player = {
      x: centerX - 125,
      y: centerY,
      radius: 12,
      color: "#2587ff",
      speed: 120,
      vx: 0,
      vy: 0
    };

    
  const ball = {
     x: centerX,
     y: centerY,
     radius: 11,
     vx: 0,
     vy: 0,
     friction: 1.8,
     restitution: 0.75
    };


    // Tracks which movement keys are currently held.
    const keys = new Set();

    const movementKeys = new Set([
      "w", "a", "s", "d",
      "arrowup", "arrowdown", "arrowleft", "arrowright"
    ]);

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (movementKeys.has(key)) {
        // Stop arrow keys from scrolling the page.
        event.preventDefault();
        keys.add(key);
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    // Avoid a stuck movement key if the browser loses focus.
    window.addEventListener("blur", () => keys.clear());

    
function updatePlayer(deltaTime) {
  let dx = 0;
  let dy = 0;

  if (keys.has("a") || keys.has("arrowleft")) dx -= 1;
  if (keys.has("d") || keys.has("arrowright")) dx += 1;
  if (keys.has("w") || keys.has("arrowup")) dy -= 1;
  if (keys.has("s") || keys.has("arrowdown")) dy += 1;

  // Normalize diagonal input.
  if (dx !== 0 || dy !== 0) {
    const length = Math.hypot(dx, dy);
    dx /= length;
    dy /= length;
  }

  // Movement feel: acceleration and friction.
  const acceleration = 600;
  const friction = 5;
  const maxSpeed = player.speed;

  if (dx !== 0 || dy !== 0) {
    player.vx += dx * acceleration * deltaTime;
    player.vy += dy * acceleration * deltaTime;
  } else {
    // Gradually slow down when no direction is held.
    const drag = Math.exp(-friction * deltaTime);
    player.vx *= drag;
    player.vy *= drag;
  }

  // Cap total velocity, including diagonal movement.
  const velocity = Math.hypot(player.vx, player.vy);

  if (velocity > maxSpeed) {
    player.vx = (player.vx / velocity) * maxSpeed;
    player.vy = (player.vy / velocity) * maxSpeed;
  }

  // Move according to current velocity.
  player.x += player.vx * deltaTime;
  player.y += player.vy * deltaTime;

  // Keep the player inside the pitch and stop at its edges.
  const minX = field.x + player.radius;
  const maxX = field.x + field.w - player.radius;
  const minY = field.y + player.radius;
  const maxY = field.y + field.h - player.radius;

  if (player.x < minX) {
    player.x = minX;
    player.vx = Math.max(0, player.vx);
  }

  if (player.x > maxX) {
    player.x = maxX;
    player.vx = Math.min(0, player.vx);
  }

  if (player.y < minY) {
    player.y = minY;
    player.vy = Math.max(0, player.vy);
  }

  if (player.y > maxY) {
    player.y = maxY;
    player.vy = Math.min(0, player.vy);
  }
}


function updateBall(deltaTime) {
  // Move the ball using its current velocity.
  ball.x += ball.vx * deltaTime;
  ball.y += ball.vy * deltaTime;

  // Gradually slow the ball down.
  const drag = Math.exp(-ball.friction * deltaTime);
  ball.vx *= drag;
  ball.vy *= drag;

  // Stop tiny movements to prevent endless drifting.
  if (Math.hypot(ball.vx, ball.vy) < 2) {
    ball.vx = 0;
    ball.vy = 0;
  }

  // Bounce off the pitch boundaries.
  const minX = field.x + ball.radius;
  const maxX = field.x + field.w - ball.radius;
  const minY = field.y + ball.radius;
  const maxY = field.y + field.h - ball.radius;

  if (ball.x < minX) {
    ball.x = minX;
    ball.vx = Math.abs(ball.vx) * ball.restitution;
  }

  if (ball.x > maxX) {
    ball.x = maxX;
    ball.vx = -Math.abs(ball.vx) * ball.restitution;
  }

  if (ball.y < minY) {
    ball.y = minY;
    ball.vy = Math.abs(ball.vy) * ball.restitution;
  }

  if (ball.y > maxY) {
    ball.y = maxY;
    ball.vy = -Math.abs(ball.vy) * ball.restitution;
  }
}

    
function handlePlayerBallCollision() {
  const dx = ball.x - player.x;
  const dy = ball.y - player.y;
  const distance = Math.hypot(dx, dy);
  const minDistance = player.radius + ball.radius;

  // No collision if the two circles aren't touching.
  if (distance >= minDistance) return;

  // Calculate the direction from player to ball.
  const nx = distance > 0 ? dx / distance : 1;
  const ny = distance > 0 ? dy / distance : 0;

  // Separate the overlapping circles.
  const overlap = minDistance - distance;
  ball.x += nx * overlap;
  ball.y += ny * overlap;

  // Transfer some player movement into the ball.
  const impactSpeed = player.vx * nx + player.vy * ny;

  if (impactSpeed > 0) {
    const kickStrength = 1.25;

    ball.vx += nx * impactSpeed * kickStrength;
    ball.vy += ny * impactSpeed * kickStrength;
  }

  // Keep the ball inside the playable area after contact.
  ball.x = Math.max(
    field.x + ball.radius,
    Math.min(field.x + field.w - ball.radius, ball.x)
  );

  ball.y = Math.max(
    field.y + ball.radius,
    Math.min(field.y + field.h - ball.radius, ball.y)
  );
}

    
    function drawGrass() {
      const { x, y, w, h } = field;

      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();

      ctx.fillStyle = "#277b43";
      ctx.fillRect(x, y, w, h);

      if (state.grass === "stripes") {
        const count = 10;
        const stripeWidth = w / count;

        for (let i = 0; i < count; i++) {
          ctx.fillStyle = i % 2 === 0 ? "#2e8749" : "#24763e";
          ctx.fillRect(x + i * stripeWidth, y, stripeWidth + 0.5, h);
        }
      } else {
        const maxRadius = Math.hypot(w / 2, h / 2) + 80;
        const step = 42;
        let index = 0;

        for (let radius = maxRadius; radius >= 0; radius -= step) {
          ctx.beginPath();
          ctx.ellipse(
            centerX, centerY,
            radius * 1.45, radius,
            0, 0, Math.PI * 2
          );

          ctx.fillStyle = index % 2 === 0 ? "#2e8749" : "#24763e";
          ctx.fill();
          index++;
        }
      }

      ctx.restore();
    }

    function drawLine(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawCircle(x, y, radius, fill = false) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      if (fill) ctx.fill();
      else ctx.stroke();
    }

    function drawGoal(side) {
      const { x, y, w, h } = field;
      const goalWidth = 35;
      const goalHeight = 112;
      const goalY = y + (h - goalHeight) / 2;
      const goalX = side === "left" ? x - goalWidth : x + w;

      ctx.fillStyle = "#dbe9dd22";
      ctx.fillRect(goalX, goalY, goalWidth, goalHeight);

      ctx.strokeStyle = "#dce6df99";
      ctx.lineWidth = 1;

      for (let i = 1; i < 5; i++) {
        const netX = goalX + goalWidth * i / 5;
        drawLine(netX, goalY, netX, goalY + goalHeight);
      }

      for (let i = 1; i < 6; i++) {
        const netY = goalY + goalHeight * i / 6;
        drawLine(goalX, netY, goalX + goalWidth, netY);
      }

      ctx.strokeStyle = "#f4f5eb";
      ctx.lineWidth = 4;
      ctx.strokeRect(goalX, goalY, goalWidth, goalHeight);
    }

    function drawMarkings() {
      const { x, y, w, h } = field;

      ctx.save();
      ctx.strokeStyle = "#f3f5e9";
      ctx.fillStyle = "#f3f5e9";
      ctx.lineWidth = 3;

      ctx.strokeRect(x, y, w, h);
      drawLine(centerX, y, centerX, y + h);
      drawCircle(centerX, centerY, 91);
      drawCircle(centerX, centerY, 4, true);

      const penaltyDepth = 165;
      const penaltyHeight = 360;
      const goalAreaDepth = 62;
      const goalAreaHeight = 190;
      const spotDistance = 110;
      const penaltyArcRadius = 91;

      for (const side of ["left", "right"]) {
        const leftSide = side === "left";

        const boxX = leftSide ? x : x + w - penaltyDepth;
        const goalBoxX = leftSide ? x : x + w - goalAreaDepth;

        ctx.strokeRect(
          boxX, centerY - penaltyHeight / 2,
          penaltyDepth, penaltyHeight
        );

        ctx.strokeRect(
          goalBoxX, centerY - goalAreaHeight / 2,
          goalAreaDepth, goalAreaHeight
        );

        const spotX = leftSide ? x + spotDistance : x + w - spotDistance;
        drawCircle(spotX, centerY, 4, true);

        ctx.beginPath();

        if (leftSide) {
          ctx.arc(spotX, centerY, penaltyArcRadius, -0.88, 0.88);
        } else {
          ctx.arc(
            spotX, centerY, penaltyArcRadius,
            Math.PI - 0.88, Math.PI + 0.88
          );
        }

        ctx.stroke();

        const r = 14;
        ctx.beginPath();

        if (leftSide) {
          ctx.arc(x, y, r, 0, Math.PI / 2);
          ctx.arc(x, y + h, r, -Math.PI / 2, 0);
        } else {
          ctx.arc(x + w, y, r, Math.PI / 2, Math.PI);
          ctx.arc(x + w, y + h, r, Math.PI, Math.PI * 1.5);
        }

        ctx.stroke();
      }

      ctx.restore();
    }

    function drawBall() {
      const { x, y, radius } = ball;

      ctx.save();

      ctx.beginPath();
      ctx.ellipse(x + 3, y + 5, radius * 0.95, radius * 0.7, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#0005";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = "#f7f7f0";
      ctx.fill();

      ctx.beginPath();

      for (let i = 0; i < 5; i++) {
        const angle = -Math.PI / 2 + i * Math.PI * 2 / 5;
        const px = x + Math.cos(angle) * radius * 0.42;
        const py = y + Math.sin(angle) * radius * 0.42;

        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }

      ctx.closePath();
      ctx.fillStyle = "#252b2d";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "#202629";
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();
    }

    function drawPlayer() {
      const { x, y, radius, color } = player;

      ctx.save();

      ctx.beginPath();
      ctx.ellipse(x + 2, y + 4, radius + 1, radius * 0.8, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#0005";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, radius + 2, 0, Math.PI * 2);
      ctx.fillStyle = "#f5f7f2";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);

      const gradient = ctx.createRadialGradient(
        x - radius * 0.35, y - radius * 0.4, 1,
        x, y, radius
      );

      gradient.addColorStop(0, "#62b0ff");
      gradient.addColorStop(1, color);

      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.strokeStyle = "#174d91";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      ctx.fillStyle = "#1c292b";
      ctx.fillRect(0, 0, W, H);

      ctx.save();

      if (state.camera === "zoom") {
        const zoom = 1.22;
        ctx.translate(centerX, centerY);
        ctx.scale(zoom, zoom);
        ctx.translate(-centerX, -centerY);
      }

      drawGrass();
      drawMarkings();
      drawGoal("left");
      drawGoal("right");
      drawPlayer();
      drawBall();

      ctx.restore();
    }

    function setOption(group, value) {
      state[group] = value;

      const ids = group === "camera"
        ? ["full", "zoom"]
        : ["stripes", "rings"];

      for (const id of ids) {
        document.getElementById(id).setAttribute(
          "aria-pressed",
          String(id === value)
        );
      }
    }

    document.getElementById("full").addEventListener(
      "click", () => setOption("camera", "full")
    );

    document.getElementById("zoom").addEventListener(
      "click", () => setOption("camera", "zoom")
    );

    document.getElementById("stripes").addEventListener(
      "click", () => setOption("grass", "stripes")
    );

    document.getElementById("rings").addEventListener(
      "click", () => setOption("grass", "rings")
    );

    // Smooth animation loop; movement is frame-rate independent.
    let previousTime = 0;

    function gameLoop(timestamp) {
      const deltaTime = previousTime === 0
        ? 0
        : Math.min((timestamp - previousTime) / 1000, 0.05);

      previousTime = timestamp;

      updatePlayer(deltaTime);
      handlePlayerBallCollision();
      updateBall(deltaTime);
      draw();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
