
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Game</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: #15191e;
    color: #f5f7fa;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  h1 {
    margin: 4px 0;
    font-size: 23px;
  }

  .scoreboard {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-size: 24px;
    font-weight: bold;
  }

  .blue { color: #58a6ff; }
  .red { color: #ff6868; }

  .game-wrap {
    width: min(100%, 1200px);
    overflow: hidden;
    border: 2px solid #3c454e;
    border-radius: 8px;
    background: #277b3c;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }

  button, select {
    background: #29323b;
    color: white;
    border: 1px solid #596673;
    border-radius: 6px;
    padding: 9px 13px;
    font-size: 14px;
    cursor: pointer;
  }

  button:hover, select:hover {
    background: #394653;
  }

  .help {
    max-width: 700px;
    text-align: center;
    line-height: 1.6;
    color: #c6ced6;
    font-size: 14px;
  }

  kbd {
    background: #303943;
    border: 1px solid #56616c;
    border-radius: 4px;
    padding: 2px 6px;
    color: white;
  }
</style>
</head>
<body>

<h1>Football</h1>

<div class="scoreboard">
  <span class="blue">BLUE</span>
  <span id="score">0 — 0</span>
  <span class="red">RED</span>
</div>

<div class="game-wrap">
  <canvas id="game" width="1200" height="760"></canvas>
</div>

<div class="controls">
  <label for="grassMode">Grass:</label>
  <select id="grassMode">
    <option value="stripes">Stripes</option>
    <option value="concentric">Concentric</option>
  </select>

  <button id="zoomOut">Wider view</button>
  <button id="zoomIn">Closer view</button>
  <button id="reset">Reset match</button>
</div>

<div class="help">
  Move with <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D>.
  Move around the ball to choose your shot angle.
  Press <kbd>Space</kbd> to kick when close enough.
  Your movement direction does not lock your shot direction.
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreElement = document.getElementById("score");
  const grassSelect = document.getElementById("grassMode");

  const W = canvas.width;
  const H = canvas.height;

  const field = {
    x: 80,
    y: 40,
    w: 1040,
    h: 680
  };

  const centerX = field.x + field.w / 2;
  const centerY = field.y + field.h / 2;

  const goal = {
    width: 48,
    height: 112,
    depth: 28
  };

  const keys = new Set();

  const state = {
    blueScore: 0,
    redScore: 0,
    zoom: 1,
    cameraX: centerX,
    cameraY: centerY,
    lastTime: 0,
    kickCooldown: 0,
    goalPause: 0
  };

  const player = {
    x: centerX - 125,
    y: centerY,
    r: 12,
    speed: 255,
    vx: 0,
    vy: 0,
    color: "#2587ff"
  };

  const ball = {
    x: centerX,
    y: centerY,
    r: 8,
    vx: 0,
    vy: 0
  };

  function updateScore() {
    scoreElement.textContent =
      state.blueScore + " — " + state.redScore;
  }

  function resetPositions() {
    player.x = centerX - 125;
    player.y = centerY;
    player.vx = 0;
    player.vy = 0;

    ball.x = centerX;
    ball.y = centerY;
    ball.vx = 0;
    ball.vy = 0;

    state.kickCooldown = 0;
    state.goalPause = 0;
  }

  function resetMatch() {
    state.blueScore = 0;
    state.redScore = 0;
    updateScore();
    resetPositions();
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function length(x, y) {
    return Math.hypot(x, y);
  }

  function normalize(x, y) {
    const len = length(x, y);
    if (len < 0.0001) return { x: 0, y: 0 };
    return { x: x / len, y: y / len };
  }

  // ---------------- INPUT ----------------

  window.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    if (
      key === "w" || key === "a" ||
      key === "s" || key === "d" ||
      event.code === "Space"
    ) {
      event.preventDefault();
    }

    if (event.repeat && event.code === "Space") return;

    keys.add(key);

    if (event.code === "Space") {
      kickBall();
    }
  });

  window.addEventListener("keyup", event => {
    keys.delete(event.key.toLowerCase());
  });

  window.addEventListener("blur", () => {
    keys.clear();
  });

  // ---------------- FREE-AIM KICK ----------------

  function kickBall() {
    if (state.goalPause > 0 || state.kickCooldown > 0) return;

    const dx = ball.x - player.x;
    const dy = ball.y - player.y;
    const distance = length(dx, dy);

    const kickRange = player.r + ball.r + 13;

    if (distance > kickRange) return;

    // The shot direction comes from the actual relative positions.
    // There are no preset directions and no separate aim control.
    const direction = normalize(dx, dy);

    // Add some of the player's current movement to the kick.
    // This helps make moving kicks feel more natural.
    const movementInfluence = 0.22;

    ball.vx += direction.x * 475 + player.vx * movementInfluence;
    ball.vy += direction.y * 475 + player.vy * movementInfluence;

    // Keep kicks powerful but prevent extreme speeds.
    const speed = length(ball.vx, ball.vy);
    const maxSpeed = 700;

    if (speed > maxSpeed) {
      ball.vx = ball.vx / speed * maxSpeed;
      ball.vy = ball.vy / speed * maxSpeed;
    }

    state.kickCooldown = 0.24;
  }

  // ---------------- PLAYER MOVEMENT ----------------

  function updatePlayer(dt) {
    let dx = 0;
    let dy = 0;

    if (keys.has("w")) dy -= 1;
    if (keys.has("s")) dy += 1;
    if (keys.has("a")) dx -= 1;
    if (keys.has("d")) dx += 1;

    const direction = normalize(dx, dy);

    player.vx = direction.x * player.speed;
    player.vy = direction.y * player.speed;

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    // Keep the player on the playable field.
    player.x = clamp(
      player.x,
      field.x + player.r,
      field.x + field.w - player.r
    );

    player.y = clamp(
      player.y,
      field.y + player.r,
      field.y + field.h - player.r
    );
  }

  // ---------------- PLAYER/BALL COLLISION ----------------

  function handlePlayerBallCollision() {
    let dx = ball.x - player.x;
    let dy = ball.y - player.y;
    let distance = length(dx, dy);

    const minDistance = player.r + ball.r;

    if (distance >= minDistance) return;

    if (distance < 0.001) {
      dx = 1;
      dy = 0;
      distance = 1;
    }

    const nx = dx / distance;
    const ny = dy / distance;
    const overlap = minDistance - distance;

    // Separate the ball and player so they don't remain stuck.
    ball.x += nx * overlap;
    ball.y += ny * overlap;

    // A gentle physical nudge from the player.
    const relativeVelocity =
      (player.vx - ball.vx) * nx +
      (player.vy - ball.vy) * ny;

    if (relativeVelocity > 0) {
      ball.vx += nx * relativeVelocity * 0.72;
      ball.vy += ny * relativeVelocity * 0.72;
    }
  }

  // ---------------- BALL PHYSICS ----------------

  function updateBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Friction gradually slows the ball.
    const friction = Math.pow(0.985, dt * 60);
    ball.vx *= friction;
    ball.vy *= friction;

    if (Math.abs(ball.vx) < 2) ball.vx = 0;
    if (Math.abs(ball.vy) < 2) ball.vy = 0;

    const goalTop = centerY - goal.height / 2;
    const goalBottom = centerY + goal.height / 2;

    const insideGoalMouth =
      ball.y > goalTop + ball.r &&
      ball.y < goalBottom - ball.r;

    // Ball enters the right goal: BLUE scores.
    if (
      ball.x - ball.r > field.x + field.w &&
      insideGoalMouth
    ) {
      state.blueScore++;
      updateScore();
      resetPositions();
      state.goalPause = 0.65;
      return;
    }

    // Ball enters the left goal: RED scores.
    if (
      ball.x + ball.r < field.x &&
      insideGoalMouth
    ) {
      state.redScore++;
      updateScore();
      resetPositions();
      state.goalPause = 0.65;
      return;
    }

    // Top and bottom touchlines.
    if (ball.y - ball.r < field.y) {
      ball.y = field.y + ball.r;
      ball.vy = Math.abs(ball.vy) * 0.78;
    }

    if (ball.y + ball.r > field.y + field.h) {
      ball.y = field.y + field.h - ball.r;
      ball.vy = -Math.abs(ball.vy) * 0.78;
    }

    // Side walls outside the goal mouth.
    if (!insideGoalMouth) {
      if (ball.x - ball.r < field.x) {
        ball.x = field.x + ball.r;
        ball.vx = Math.abs(ball.vx) * 0.78;
      }

      if (ball.x + ball.r > field.x + field.w) {
        ball.x = field.x + field.w - ball.r;
        ball.vx = -Math.abs(ball.vx) * 0.78;
      }
    }

    // Keep the ball inside the goal depth when it misses the opening.
    if (ball.x < field.x - goal.depth) {
      ball.x = field.x - goal.depth;
      ball.vx = Math.abs(ball.vx) * 0.65;
    }

    if (ball.x > field.x + field.w + goal.depth) {
      ball.x = field.x + field.w + goal.depth;
      ball.vx = -Math.abs(ball.vx) * 0.65;
    }
  }

  // ---------------- CAMERA ----------------

  function updateCamera() {
    const viewW = W / state.zoom;
    const viewH = H / state.zoom;

    const worldLeft = field.x - goal.depth - 8;
    const worldRight = field.x + field.w + goal.depth + 8;
    const worldTop = field.y - 8;
    const worldBottom = field.y + field.h + 8;

    const minX = worldLeft + viewW / 2;
    const maxX = worldRight - viewW / 2;
    const minY = worldTop + viewH / 2;
    const maxY = worldBottom - viewH / 2;

    // Follow the ball smoothly without rotating the pitch.
    const targetX = ball.x;
    const targetY = ball.y;

    const smooth = 1 - Math.pow(0.001, 1 / 60);

    state.cameraX += (targetX - state.cameraX) * smooth;
    state.cameraY += (targetY - state.cameraY) * smooth;

    state.cameraX = minX > maxX
      ? (worldLeft + worldRight) / 2
      : clamp(state.cameraX, minX, maxX);

    state.cameraY = minY > maxY
      ? (worldTop + worldBottom) / 2
      : clamp(state.cameraY, minY, maxY);
  }

  // ---------------- FIELD DRAWING ----------------

  function drawGrass() {
    ctx.fillStyle = "#287d3e";
    ctx.fillRect(
      field.x - goal.depth - 20,
      field.y - 20,
      field.w + goal.depth * 2 + 40,
      field.h + 40
    );

    if (grassSelect.value === "stripes") {
      const stripeCount = 10;
      const stripeW = field.w / stripeCount;

      for (let i = 0; i < stripeCount; i++) {
        ctx.fillStyle = i % 2 === 0
          ? "#31894a"
          : "#287d3e";

        ctx.fillRect(
          field.x + i * stripeW,
          field.y,
          stripeW,
          field.h
        );
      }
    } else {
      ctx.fillStyle = "#31894a";
      ctx.fillRect(field.x, field.y, field.w, field.h);

      for (let i = 0; i < 12; i++) {
        ctx.beginPath();
        ctx.ellipse(
          centerX,
          centerY,
          50 + i * 43,
          35 + i * 28,
          0,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle = i % 2 === 0
          ? "rgba(255,255,255,0.035)"
          : "rgba(0,0,0,0.035)";

        ctx.lineWidth = 18;
        ctx.stroke();
      }
    }
  }

  function drawGoal(x, y, direction) {
    const gx = direction < 0 ? x - goal.depth : x;
    const gy = y - goal.height / 2;

    ctx.fillStyle = "#dce4e8";
    ctx.fillRect(gx, gy, goal.depth, goal.height);

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.strokeRect(gx, gy, goal.depth, goal.height);

    ctx.strokeStyle = "rgba(30,40,45,0.38)";
    ctx.lineWidth = 1;

    const spacing = 9;

    for (let i = spacing; i < goal.depth; i += spacing) {
      ctx.beginPath();
      ctx.moveTo(gx + i, gy);
      ctx.lineTo(gx + i, gy + goal.height);
      ctx.stroke();
    }

    for (let i = spacing; i < goal.height; i += spacing) {
      ctx.beginPath();
      ctx.moveTo(gx, gy + i);
      ctx.lineTo(gx + goal.depth, gy + i);
      ctx.stroke();
    }
  }

  function drawMarkings() {
    ctx.strokeStyle = "rgba(255,255,255,0.92)";
    ctx.lineWidth = 3;

    ctx.strokeRect(field.x, field.y, field.w, field.h);

    ctx.beginPath();
    ctx.moveTo(centerX, field.y);
    ctx.lineTo(centerX, field.y + field.h);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(centerX, centerY, 90, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.beginPath();
    ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
    ctx.fill();

    const boxDepth = 150;
    const boxHeight = 300;
    const smallDepth = 60;
    const smallHeight = 160;

    // Left penalty area.
    ctx.strokeRect(
      field.x,
      centerY - boxHeight / 2,
      boxDepth,
      boxHeight
    );

    ctx.strokeRect(
      field.x,
      centerY - smallHeight / 2,
      smallDepth,
      smallHeight
    );

    // Right penalty area.
    ctx.strokeRect(
      field.x + field.w - boxDepth,
      centerY - boxHeight / 2,
      boxDepth,
      boxHeight
    );

    ctx.strokeRect(
      field.x + field.w - smallDepth,
      centerY - smallHeight / 2,
      smallDepth,
      smallHeight
    );

    // Penalty spots.
    ctx.fillStyle = "white";

    for (const x of [
      field.x + 105,
      field.x + field.w - 105
    ]) {
      ctx.beginPath();
      ctx.arc(x, centerY, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Goal-area arcs.
    ctx.beginPath();
    ctx.arc(
      field.x + 105,
      centerY,
      62,
      -0.95,
      0.95
    );
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(
      field.x + field.w - 105,
      centerY,
      62,
      Math.PI - 0.95,
      Math.PI + 0.95
    );
    ctx.stroke();
  }

  // ---------------- PLAYER AND BALL DRAWING ----------------

  function drawPlayer() {
    // Shadow.
    ctx.beginPath();
    ctx.ellipse(
      player.x + 2,
      player.y + 4,
      player.r + 2,
      player.r,
      0,
      0,
      Math.PI * 2
    );
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fill();

    // Player body.
    ctx.beginPath();
    ctx.arc(
      player.x,
      player.y,
      player.r,
      0,
      Math.PI * 2
    );
    ctx.fillStyle = player.color;
    ctx.fill();

    ctx.lineWidth = 2;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();

    // Subtle center highlight.
    ctx.beginPath();
    ctx.arc(
      player.x - 3,
      player.y - 3,
      3,
      0,
      Math.PI * 2
    );
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.ellipse(
      ball.x + 2,
      ball.y + 3,
      ball.r + 1,
      ball.r,
      0,
      0,
      Math.PI * 2
    );
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#222a30";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(
      ball.x - 2,
      ball.y - 2,
      2,
      0,
      Math.PI * 2
    );
    ctx.fillStyle = "#c6cdd2";
    ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.save();

    // Horizontal camera only: never rotate the pitch.
    ctx.translate(W / 2, H / 2);
    ctx.scale(state.zoom, state.zoom);
    ctx.translate(-state.cameraX, -state.cameraY);

    drawGrass();

    drawGoal(field.x, centerY, -1);
    drawGoal(field.x + field.w, centerY, 1);

    drawMarkings();
    drawPlayer();
    drawBall();

    ctx.restore();
  }

  // ---------------- GAME LOOP ----------------

  function update(dt) {
    state.kickCooldown = Math.max(0, state.kickCooldown - dt);

    if (state.goalPause > 0) {
      state.goalPause = Math.max(0, state.goalPause - dt);
      updateCamera();
      return;
    }

    updatePlayer(dt);
    handlePlayerBallCollision();
    updateBall(dt);
    updateCamera();
  }

  function loop(timestamp) {
    if (!state.lastTime) state.lastTime = timestamp;

    const dt = Math.min((timestamp - state.lastTime) / 1000, 0.033);
    state.lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  // ---------------- UI CONTROLS ----------------

  document.getElementById("zoomOut").addEventListener("click", () => {
    state.zoom = 0.85;
  });

  document.getElementById("zoomIn").addEventListener("click", () => {
    state.zoom = 1.12;
  });

  document.getElementById("reset").addEventListener("click", resetMatch);

  updateScore();
  updateCamera();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
