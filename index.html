
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kickoff Football</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #263640, #10171d 70%);
      color: #edf3f0;
      font-family: Arial, sans-serif;
    }

    .app {
      width: min(100%, 1120px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 32px);
      letter-spacing: -1px;
    }

    .accent {
      color: #80d69a;
    }

    .subtitle {
      margin-top: 6px;
      color: #9eafb5;
      font-size: 13px;
    }

    .status {
      color: #a7efbd;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .stadium {
      padding: 10px;
      border: 1px solid #40515a;
      border-radius: 12px;
      background: #202d34;
      box-shadow: 0 24px 70px #0006;
    }

    .viewport {
      overflow: hidden;
      border-radius: 5px;
      background: #216c3c;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 16px 4px 4px;
    }

    .group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .label {
      color: #9eafb5;
      font-size: 12px;
      margin-right: 3px;
    }

    button {
      padding: 9px 12px;
      border: 1px solid #455760;
      border-radius: 6px;
      background: #293840;
      color: #e5eeeb;
      cursor: pointer;
      font-size: 12px;
      transition: background 120ms, border-color 120ms;
    }

    button:hover {
      border-color: #91c7a0;
    }

    button[aria-pressed="true"] {
      background: #285f40;
      border-color: #71bd8a;
      color: white;
    }

    button:focus-visible {
      outline: 2px solid #a7efbd;
      outline-offset: 3px;
    }

    .note {
      margin: 12px 2px 0;
      color: #84969e;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 10px;
      }

      .stadium {
        padding: 6px;
      }

      .controls {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <h1>KICKOFF <span class="accent">FOOTBALL</span></h1>
        <div class="subtitle">THE PITCH · PLAYER PREVIEW</div>
      </div>

      <div class="status">● DEVELOPMENT</div>
    </header>

    <section class="stadium">
      <div class="viewport">
        <canvas
          id="pitch"
          width="1200"
          height="760"
          aria-label="Football pitch with one blue player and a ball"
        ></canvas>
      </div>

      <div class="controls">
        <div class="group">
          <span class="label">CAMERA</span>
          <button id="full" aria-pressed="true">Full pitch</button>
          <button id="zoom" aria-pressed="false">Zoomed in</button>
        </div>

        <div class="group">
          <span class="label">GRASS</span>
          <button id="stripes" aria-pressed="true">Stripes</button>
          <button id="rings" aria-pressed="false">Concentric</button>
        </div>
      </div>
    </section>

    <p class="note">
      Visual preview · Player and ball are stationary for now.
    </p>
  </main>

  <script>
    const canvas = document.getElementById("pitch");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;

    const field = {
      x: 80,
      y: 40,
      w: 1040,
      h: 680
    };

    const centerX = field.x + field.w / 2;
    const centerY = field.y + field.h / 2;

    const state = {
      camera: "full",
      grass: "stripes"
    };

    // Our first player.
    const player = {
      x: centerX - 125,
      y: centerY,
      radius: 12,
      color: "#2587ff"
    };

    // Stationary football at the center spot.
    const ball = {
      x: centerX,
      y: centerY,
      radius: 11
    };

    function drawGrass() {
      const { x, y, w, h } = field;

      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();

      ctx.fillStyle = "#277b43";
      ctx.fillRect(x, y, w, h);

      if (state.grass === "stripes") {
        const count = 10;
        const stripeWidth = w / count;

        for (let i = 0; i < count; i++) {
          ctx.fillStyle = i % 2 === 0
            ? "#2e8749"
            : "#24763e";

          ctx.fillRect(
            x + i * stripeWidth,
            y,
            stripeWidth + 0.5,
            h
          );
        }
      } else {
        // Alternating elliptical bands.
        const maxRadius = Math.hypot(w / 2, h / 2) + 80;
        const step = 42;
        let index = 0;

        for (
          let radius = maxRadius;
          radius >= 0;
          radius -= step
        ) {
          ctx.beginPath();
          ctx.ellipse(
            centerX,
            centerY,
            radius * 1.45,
            radius,
            0,
            0,
            Math.PI * 2
          );

          ctx.fillStyle = index % 2 === 0
            ? "#2e8749"
            : "#24763e";

          ctx.fill();
          index++;
        }
      }

      ctx.restore();
    }

    function drawLine(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawCircle(x, y, radius, fill = false) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);

      if (fill) {
        ctx.fill();
      } else {
        ctx.stroke();
      }
    }

    function drawGoal(side) {
      const { x, y, w, h } = field;
      const goalWidth = 35;
      const goalHeight = 112;
      const goalY = y + (h - goalHeight) / 2;

      const goalX = side === "left"
        ? x - goalWidth
        : x + w;

      // Net background.
      ctx.fillStyle = "#dbe9dd22";
      ctx.fillRect(goalX, goalY, goalWidth, goalHeight);

      // Net mesh.
      ctx.strokeStyle = "#dce6df99";
      ctx.lineWidth = 1;

      for (let i = 1; i < 5; i++) {
        const netX = goalX + goalWidth * i / 5;
        drawLine(netX, goalY, netX, goalY + goalHeight);
      }

      for (let i = 1; i < 6; i++) {
        const netY = goalY + goalHeight * i / 6;
        drawLine(goalX, netY, goalX + goalWidth, netY);
      }

      // Goal frame.
      ctx.strokeStyle = "#f4f5eb";
      ctx.lineWidth = 4;
      ctx.strokeRect(goalX, goalY, goalWidth, goalHeight);
    }

    function drawMarkings() {
      const { x, y, w, h } = field;

      ctx.save();
      ctx.strokeStyle = "#f3f5e9";
      ctx.fillStyle = "#f3f5e9";
      ctx.lineWidth = 3;

      // Outer boundary and halfway line.
      ctx.strokeRect(x, y, w, h);
      drawLine(centerX, y, centerX, y + h);

      // Center circle and spot.
      drawCircle(centerX, centerY, 91);
      drawCircle(centerX, centerY, 4, true);

      const penaltyDepth = 165;
      const penaltyHeight = 360;
      const goalAreaDepth = 62;
      const goalAreaHeight = 190;
      const spotDistance = 110;
      const penaltyArcRadius = 91;

      for (const side of ["left", "right"]) {
        const leftSide = side === "left";

        const boxX = leftSide
          ? x
          : x + w - penaltyDepth;

        const goalBoxX = leftSide
          ? x
          : x + w - goalAreaDepth;

        ctx.strokeRect(
          boxX,
          centerY - penaltyHeight / 2,
          penaltyDepth,
          penaltyHeight
        );

        ctx.strokeRect(
          goalBoxX,
          centerY - goalAreaHeight / 2,
          goalAreaDepth,
          goalAreaHeight
        );

        const spotX = leftSide
          ? x + spotDistance
          : x + w - spotDistance;

        drawCircle(spotX, centerY, 4, true);

        // The visible penalty arc.
        ctx.beginPath();

        if (leftSide) {
          ctx.arc(
            spotX,
            centerY,
            penaltyArcRadius,
            -0.88,
            0.88
          );
        } else {
          ctx.arc(
            spotX,
            centerY,
            penaltyArcRadius,
            Math.PI - 0.88,
            Math.PI + 0.88
          );
        }

        ctx.stroke();

        // Corner arcs.
        const r = 14;

        ctx.beginPath();

        if (leftSide) {
          ctx.arc(x, y, r, 0, Math.PI / 2);
          ctx.arc(x, y + h, r, -Math.PI / 2, 0);
        } else {
          ctx.arc(x + w, y, r, Math.PI / 2, Math.PI);
          ctx.arc(x + w, y + h, r, Math.PI, Math.PI * 1.5);
        }

        ctx.stroke();
      }

      ctx.restore();
    }

    function drawBall() {
      const { x, y, radius } = ball;

      ctx.save();

      // Soft shadow.
      ctx.beginPath();
      ctx.ellipse(
        x + 3,
        y + 5,
        radius * 0.95,
        radius * 0.7,
        0,
        0,
        Math.PI * 2
      );
      ctx.fillStyle = "#0005";
      ctx.fill();

      // White ball.
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = "#f7f7f0";
      ctx.fill();

      // Central black pentagon.
      ctx.beginPath();

      for (let i = 0; i < 5; i++) {
        const angle = -Math.PI / 2 + i * Math.PI * 2 / 5;
        const px = x + Math.cos(angle) * radius * 0.42;
        const py = y + Math.sin(angle) * radius * 0.42;

        if (i === 0) {
          ctx.moveTo(px, py);
        } else {
          ctx.lineTo(px, py);
        }
      }

      ctx.closePath();
      ctx.fillStyle = "#252b2d";
      ctx.fill();

      // Ball outline.
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "#202629";
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();
    }

    function drawPlayer() {
      const { x, y, radius, color } = player;

      ctx.save();

      // Soft shadow beneath the player marker.
      ctx.beginPath();
      ctx.ellipse(
        x + 2,
        y + 4,
        radius + 1,
        radius * 0.8,
        0,
        0,
        Math.PI * 2
      );
      ctx.fillStyle = "#0005";
      ctx.fill();

      // Light outer ring.
      ctx.beginPath();
      ctx.arc(x, y, radius + 2, 0, Math.PI * 2);
      ctx.fillStyle = "#f5f7f2";
      ctx.fill();

      // Blue circular body.
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);

      const gradient = ctx.createRadialGradient(
        x - radius * 0.35,
        y - radius * 0.4,
        1,
        x,
        y,
        radius
      );

      gradient.addColorStop(0, "#62b0ff");
      gradient.addColorStop(1, color);

      ctx.fillStyle = gradient;
      ctx.fill();

      // Thin dark outline.
      ctx.strokeStyle = "#174d91";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Stadium surround.
      ctx.fillStyle = "#1c292b";
      ctx.fillRect(0, 0, W, H);

      ctx.save();

      // Zoom around the center of the field.
      if (state.camera === "zoom") {
        const zoom = 1.22;

        ctx.translate(centerX, centerY);
        ctx.scale(zoom, zoom);
        ctx.translate(-centerX, -centerY);
      }

      drawGrass();
      drawMarkings();
      drawGoal("left");
      drawGoal("right");

      // Draw the player before the ball so the ball stays visible.
      drawPlayer();
      drawBall();

      ctx.restore();
    }

    function setOption(group, value) {
      state[group] = value;

      const ids = group === "camera"
        ? ["full", "zoom"]
        : ["stripes", "rings"];

      for (const id of ids) {
        document.getElementById(id).setAttribute(
          "aria-pressed",
          String(id === value)
        );
      }

      draw();
    }

    document.getElementById("full").addEventListener(
      "click",
      () => setOption("camera", "full")
    );

    document.getElementById("zoom").addEventListener(
      "click",
      () => setOption("camera", "zoom")
    );

    document.getElementById("stripes").addEventListener(
      "click",
      () => setOption("grass", "stripes")
    );

    document.getElementById("rings").addEventListener(
      "click",
      () => setOption("grass", "rings")
    );

    draw();
  </script>
</body>
</html>
